<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz cumpleaños, Famositoo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="confetti"></canvas>

<div class="app">
  <div class="pages" id="pages">

    <!-- P1 SOBRE -->
    <div class="page" data-page="1" id="p1">
      <button class="hit" id="envelopeHit" style="left:30%;top:45%;width:40%;height:35%;"></button>
    </div>

    <!-- P2 ACEPTA ESTE REGALO -->
    <div class="page" data-page="2">
      <button class="hit" id="yesBtn" style="left:28%;top:73%;width:14%;height:9%;"></button>
      <button class="hit" id="noBtn" style="left:57%;top:73%;width:14%;height:9%;"></button>
    </div>

    <!-- P3 LE DISTE QUE NO -->
    <div class="page" data-page="3">
      <button class="hit" id="retryBtn1" style="left:31%;top:74%;width:38%;height:9%;"></button>
    </div>

    <!-- P4 MAS VALE LE DES SI -->
    <div class="page" data-page="4">
      <button class="hit" id="retryBtn2" style="left:31%;top:74%;width:38%;height:9%;"></button>
    </div>

    <!-- P5 GOOD BOY -->
    <div class="page" data-page="5">
      <button class="hit" id="nextBtn5" style="left:31%;top:73%;width:38%;height:9%;"></button>
    </div>

    <!-- P6 LINEA DE TIEMPO -->
    <div class="page" data-page="6">
      <button class="hit" id="booHit" style="left:9.8%;top:59.5%;width:10%;height:27%;"></button>
      <button class="hit" id="encuentroHit" style="left:36.8%;top:59.5%;width:24%;height:31.5%;"></button>
      <button class="hit" id="specialHit" style="left:71.6%;top:59.5%;width:21.5%;height:31%;"></button>
    </div>

    <!-- P7 BOO -->
    <div class="page" data-page="7">
      <button class="hit" id="backBoo" style="left:84.5%;top:86%;width:11%;height:9.5%;"></button>
    </div>

    <!-- P8 ENCUENTRO -->
    <div class="page" data-page="8">
      <button class="hit" id="backEncuentro" style="left:84.5%;top:86%;width:11%;height:9.5%;"></button>
    </div>

    <!-- P9 SPECIAL DAY -->
    <div class="page" data-page="9">
      <button class="hit" id="nextBtnSpecial" style="left:84.5%;top:85.5%;width:11%;height:9.5%;"></button>
    </div>

    <!-- P10 MAKE A WISH (velas prendidas) -->
    <div class="page" data-page="10">
      <button class="hit" id="soplaBtn" style="left:43%;top:80%;width:14%;height:9%;"></button>
    </div>

    <!-- P11 MAKE A WISH (velas apagadas) -->
    <div class="page" data-page="11">
      <button class="hit" id="nextBtn8" style="left:80%;top:80%;width:13%;height:9%;"></button>
    </div>

    <!-- P12 REGALOS -->
    <div class="page" data-page="12">
      <button class="hit gift" id="giftLeft" data-branch="C" style="left:6%;top:53%;width:22%;height:27%;"></button>
      <button class="hit gift" id="giftCenter" data-branch="B" style="left:38%;top:38%;width:20%;height:27%;"></button>
      <button class="hit gift" id="giftRight" data-branch="A" style="left:70%;top:53%;width:22%;height:27%;"></button>
      <div class="badge" id="badgeLeft">✓</div>
      <div class="badge" id="badgeCenter">✓</div>
      <div class="badge" id="badgeRight">✓</div>
      <button class="pill-btn" id="toFinalBtn" style="display:none;">Siguiente ➜</button>
    </div>

    <!-- P13 HAPPY BIRTHDAY -->
    <div class="page" data-page="13">
      <button class="round-btn corner" id="nextBtn10">➜</button>
    </div>

    <!-- P14 CARTA -->
    <div class="page" data-page="14">
      <button class="pill-btn bottom-center" data-return="C">🎁 Volver a los regalos</button>
    </div>

    <!-- P15 CERTIFICADO -->
    <div class="page" data-page="15">
      <button class="round-btn corner" id="nextBtn12">➜</button>
    </div>

    <!-- P16 CUPONES -->
    <div class="page" data-page="16">
      <button class="pill-btn bottom-center" data-return="B">🎁 Volver a los regalos</button>
    </div>

    <!-- P17 ARMA EL PUZZLE -->
    <div class="page" data-page="17">
      <div class="puzzle-board" id="board" style="left:8%;top:32%;width:56%;height:52%;"></div>
      <div class="p-status" id="status" style="left:8%;top:85%;">tocá dos piezas para cambiarlas</div>
      <button class="pill-btn small" id="shuffleBtn" style="left:8%;top:90%;">Mezclar</button>
      <button class="pill-btn small" id="nextBtn14" style="left:32%;top:90%;display:none;">Siguiente ➜</button>
    </div>

    <!-- P18 SOPA DE LETRAS -->
    <div class="page" data-page="18">
      <div class="ws-grid" id="wsGrid" style="left:20%;top:26%;width:37%;height:63%;"></div>
      <div class="ws-words" id="wsWords" style="left:60%;top:33%;width:36%;"></div>
      <button class="pill-btn bottom-center" id="wsBackBtn" data-return="A" style="display:none;">🎁 Volver a los regalos</button>
    </div>

    <!-- P19 FINAL -->
    <div class="page" data-page="19">
      <div class="vinyl-spin" id="vinylSpin" style="left:47.7%;top:42.9%;width:19%;"><img src="img/vinyl_disc.png" alt=""></div>
      <button class="hit" id="confettiBtn" style="left:41%;top:78%;width:18%;height:9%;"></button>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
